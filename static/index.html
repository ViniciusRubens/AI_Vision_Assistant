<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViLT Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        <h1>AI Vision Assistant (ViLT)</h1>

        <div id="previewBox" class="preview-container">
            <img id="imagePreview" src="" alt="Preview">
        </div>

        <div class="form-group">
            <label>Select an image</label>
            <input type="file" id="imageInput" accept="image/*" onchange="showPreview(event)">
        </div>

        <div class="form-group">
            <label>Your question (in english)</label>
            <input type="text" id="textInput" placeholder="Ex: What color is the dog?">
        </div>

        <div class="button-group">
            <button class="btn-analyze" onclick="sendToAPI()">Analyze</button>
            <button class="btn-clear" onclick="cleanInputs()">Clear</button>
        </div>

        <div id="loading" class="loading">Starting processing in the model...</div>
        <div id="result"></div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
